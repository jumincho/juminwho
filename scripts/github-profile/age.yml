# Generated by `npm run github-profile` in jumincho/juminwho. Do not edit here.
#
# Recomputes Jumin's age once a day and redraws it in assets/glance-*.svg.
# The commit comes from github-actions[bot], so it stays off the
# contribution graph.

name: Update age

on:
  schedule:
    - cron: '5 15 * * *' # 00:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-age
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/update-age.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update age counter"
          git push
