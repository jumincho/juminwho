<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>JUMIN WHO?</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff8f0;
        --ink: #45352b;
        --link: #ae4b33;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1916;
          --ink: #f7ecdf;
          --link: #ffb08c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 600 1.125rem/1.6 ui-rounded, system-ui, sans-serif;
      }
      a {
        color: var(--link);
      }
    </style>
    <script>
      // The site is a single page. GitHub Pages serves this file for any unknown path, so
      // send stale deep links (old /blog, /cv, ...) to the root of this deployment, which is
      // the first path segment on a project site.
      ;(function () {
        var segments = window.location.pathname.split('/').filter(Boolean)
        var home = segments.length > 1 ? '/' + segments[0] + '/' : '/'
        window.location.replace(home)
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('home').href = home
        })
      })()
    </script>
  </head>
  <body>
    <p>This page has moved. <a id="home" href="/">Take me home</a></p>
  </body>
</html>
