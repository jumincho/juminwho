<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fff8f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1916" media="(prefers-color-scheme: dark)" />
    <!-- <title>, description, canonical and social tags come from src/data/profile.ts (see vite.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved or system theme, and the page language, before first paint so nothing flashes.
      // The keys must match THEME_STORAGE_KEY in src/lib/theme.ts and LANG_STORAGE_KEY / LANG_PARAM in src/lib/i18n.ts.
      ;(function () {
        var stored = null
        var lang = null
        try {
          stored = localStorage.getItem('juminwho:theme')
          lang = localStorage.getItem('juminwho:lang')
        } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        lang = new URLSearchParams(location.search).get('lang') || lang
        if (/^(en|zh-CN|zh-HK|ja|ko)$/.test(lang)) document.documentElement.lang = lang
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
